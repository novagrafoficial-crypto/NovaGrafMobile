name: CI - Nova Graf Mobile

on:
  push:
    branches:
      - main
      - develop
      - release
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop
      - release

jobs:
  pruebas:
    # No cambiar este nombre: es el check obligatorio del ruleset
    name: Pruebas y TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial completo

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm test -- --runInBand --coverage

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Análisis de calidad (SonarQube Cloud)
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
