name: Android - Producción EAS

on:
  push:
    branches:
      - release
      - main

  workflow_dispatch:

jobs:
  validar:
    name: Validar antes de compilar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand

      - name: Verificar TypeScript
        run: npm run typecheck

  build-android:
    name: Compilar Android AAB
    needs: validar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Configurar Expo y EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Iniciar compilación Android de producción
        run: eas build --platform android --profile production --non-interactive
