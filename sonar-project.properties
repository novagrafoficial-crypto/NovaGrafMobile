# Configuración de SonarQube Cloud - Nova Graf Mobile
sonar.projectKey=novagrafoficial-crypto_NovaGrafMobile
sonar.organization=novagrafoficial-crypto
sonar.projectName=NovaGrafMobile
sonar.projectVersion=1.0.0

# Código a analizar y código de pruebas
sonar.sources=src,.github/workflows
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.{ts,tsx,js}

# Reporte de cobertura generado por Jest
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integracion/lcov.info

# La interfaz (pantallas y componentes visuales) se valida con pruebas de caja negra (Maestro);
# la cobertura se mide sobre la lógica: ViewModels, servicios, utilidades, providers y datos.
sonar.coverage.exclusions=src/app/**,src/**/views/**,src/**/components/**,src/constants/**,src/**/constants/**,src/**/models/**,src/types/**

# Textos legales y constantes (Aviso de Privacidad): son datos, no lógica; su estructura repetida
# no es código duplicado.
sonar.cpd.exclusions=src/**/constants/**

sonar.sourceEncoding=UTF-8
